<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECT Delta / Euromax Rules – Quiz</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --text: #e2e8f0;
    --accent: #38bdf8; --correct: #22c55e; --wrong: #ef4444; --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 24px 16px 48px;
  }
  .header {
    width: 100%; max-width: 640px; display: flex;
    justify-content: space-between; align-items: flex-start;
    margin-bottom: 8px; gap: 12px;
  }
  h1 { font-size: 1.4rem; line-height: 1.3; }
  .lang-btn {
    background: #334155; color: var(--text); border: 2px solid var(--accent);
    border-radius: 10px; padding: 8px 14px; font-size: 0.9rem;
    font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .lang-btn:hover { background: #475569; }
  .subtitle { color: var(--muted); margin-bottom: 6px; font-size: 0.92rem; width: 100%; max-width: 640px; }
  .base-info { font-size: 0.8rem; color: var(--muted); margin-bottom: 18px; width: 100%; max-width: 640px; }
  #quiz-container { width: 100%; max-width: 640px; }
  .progress {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; font-size: 0.88rem; color: var(--muted);
  }
  .progress-bar { flex: 1; height: 6px; background: #334155; border-radius: 3px; margin: 0 10px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s ease; }
  .card {
    background: var(--card); border-radius: 16px; padding: 26px 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .question-text { font-size: 1.1rem; font-weight: 600; margin-bottom: 20px; line-height: 1.45; }
  .options { display: flex; flex-direction: column; gap: 11px; }
  .option {
    background: #334155; border: 2px solid transparent; border-radius: 12px;
    padding: 13px 15px; cursor: pointer; transition: all 0.2s ease;
    font-size: 0.97rem; text-align: left; color: var(--text);
  }
  .option:hover:not(.disabled) { background: #475569; border-color: var(--accent); }
  .option.correct { background: rgba(34,197,94,0.18); border-color: var(--correct); color: #bbf7d0; }
  .option.wrong { background: rgba(239,68,68,0.18); border-color: var(--wrong); color: #fecaca; }
  .option.disabled { cursor: default; pointer-events: none; }
  .feedback { margin-top: 16px; padding: 12px 14px; border-radius: 10px; font-size: 0.93rem; display: none; }
  .feedback.show { display: block; }
  .feedback.ok { background: rgba(34,197,94,0.15); color: #86efac; border: 1px solid var(--correct); }
  .feedback.err { background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid var(--wrong); }
  .btn-row { margin-top: 22px; display: flex; gap: 12px; justify-content: flex-end; }
  button.action {
    border: none; border-radius: 10px; padding: 12px 22px;
    font-size: 1rem; font-weight: 600; cursor: pointer;
  }
  button.action:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-next { background: var(--accent); color: #0f172a; }
  .btn-restart { background: #475569; color: var(--text); }
  .result { text-align: center; padding: 18px 0; }
  .result h2 { font-size: 1.4rem; margin-bottom: 10px; }
  .score { font-size: 2.3rem; font-weight: 700; color: var(--accent); margin: 12px 0 18px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="header">
    <h1 id="title">ECT Delta / Euromax Rules</h1>
    <button class="lang-btn" id="lang-btn" onclick="toggleLang()">Русский</button>
  </div>
  <p class="subtitle" id="subtitle">10 random questions · Multiple choice · Instant feedback</p>
  <p class="base-info" id="base-info"></p>

  <div id="quiz-container">
    <div class="progress">

      <span id="score-live">Score: 0</span>

    <div class="card" id="question-card">
      <div class="question-text" id="question"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="btn-row">
        <button class="action btn-next" id="next-btn" disabled>Next</button>
      </div>
    </div>
    <div class="card result hidden" id="result-card">
      <h2 id="result-title">Quiz finished!</h2>
      <div class="score" id="final-score"></div>
      <p id="result-msg" style="color:var(--muted); margin-bottom:22px;"></p>
      <button class="action btn-restart" id="restart-btn">Take another random quiz</button>
    </div>
  </div>

let lang = 'en', quiz = [], current = 0, score = 0, answered = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function t() { return UI[lang]; }

function updateUITexts() {
  const u = t();
  document.getElementById('title').textContent = u.title;
  document.getElementById('subtitle').textContent = u.subtitle;
  document.getElementById('lang-btn').textContent = u.langBtn;
  document.getElementById('score-live').textContent = u.score + ': ' + score;
  document.getElementById('result-title').textContent = u.resultTitle;
  document.getElementById('restart-btn').textContent = u.restart;
  document.getElementById('base-info').textContent = u.baseInfo + ': ' + allQuestions.length;
  document.getElementById('next-btn').textContent = current === 9 ? u.finish : u.next;
  if (!document.getElementById('result-card').classList.contains('hidden')) showResult(false);
  else document.getElementById('q-num').textContent = u.question + ' ' + (current + 1) + ' / 10';
}

function toggleLang() {
  lang = lang === 'en' ? 'ru' : 'en';
  updateUITexts();
  if (!document.getElementById('result-card').classList.contains('hidden')) return;
  const q = quiz[current], data = q[lang];
  document.getElementById('question').textContent = data.q;
  document.querySelectorAll('.option').forEach((btn, i) => { btn.textContent = data.options[i]; });
  const fb = document.getElementById('feedback');
  if (fb.classList.contains('show')) {
    fb.textContent = fb.classList.contains('ok') ? t().correct : (t().incorrect + ' ' + data.options[q.correct]);
  }
}

function startQuiz() {
  quiz = shuffle(allQuestions).slice(0, 10);
  current = 0; score = 0; answered = false;
  document.getElementById('question-card').classList.remove('hidden');
  document.getElementById('result-card').classList.add('hidden');
  updateUITexts();
  showQuestion();
}

function showQuestion() {
  answered = false;
  const q = quiz[current], data = q[lang], u = t();
  document.getElementById('q-num').textContent = u.question + ' ' + (current + 1) + ' / 10';
  document.getElementById('progress').style.width = ((current / 10) * 100) + '%';
  document.getElementById('question').textContent = data.q;
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  data.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(i);
    opts.appendChild(btn);
  });
  const fb = document.getElementById('feedback');
  fb.className = 'feedback'; fb.textContent = '';
  document.getElementById('next-btn').disabled = true;
  document.getElementById('next-btn').textContent = current === 9 ? u.finish : u.next;
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = quiz[current], data = q[lang], u = t();
  const buttons = document.querySelectorAll('.option');
  buttons.forEach(b => b.classList.add('disabled'));
  buttons[idx].classList.add(idx === q.correct ? 'correct' : 'wrong');
  if (idx !== q.correct) buttons[q.correct].classList.add('correct');
  const fb = document.getElementById('feedback');
  if (idx === q.correct) {
    score++;
    fb.className = 'feedback show ok';
    fb.textContent = u.correct;
  } else {
    fb.className = 'feedback show err';
    fb.textContent = u.incorrect + ' ' + data.options[q.correct];
  }
  document.getElementById('score-live').textContent = u.score + ': ' + score;
  document.getElementById('next-btn').disabled = false;
}

document.getElementById('next-btn').onclick = () => {
  if (current < 9) { current++; showQuestion(); }
  else showResult(true);
};

function showResult(updateProgress) {
  if (updateProgress) document.getElementById('progress').style.width = '100%';
  document.getElementById('question-card').classList.add('hidden');
  document.getElementById('result-card').classList.remove('hidden');
  document.getElementById('final-score').textContent = score + ' / 10';
  const u = t();
  let msg = score === 10 ? u.msgPerfect : score >= 8 ? u.msgVeryGood : score >= 6 ? u.msgGood : u.msgStudy;
  document.getElementById('result-msg').textContent = msg;
  document.getElementById('result-title').textContent = u.resultTitle;
  document.getElementById('restart-btn').textContent = u.restart;
}

document.getElementById('restart-btn').onclick = startQuiz;
document.getElementById('base-info').textContent = 'Question bank: ' + allQuestions.length;
startQuiz();
